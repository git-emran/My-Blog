baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'I'm Emran'

[module]
[[module.imports]]
path = "github.com/tomfran/typo"



[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "A Tech Blog"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'Welcome to my Blog 👋!'
homeIntroContent = """
I’m Emran Hossain, a Software Engineer and Designer.
This is my little corner of the internet where I share thoughts, principles, and ideas I care about. I write about technology, life, and everything in between. I post whenever inspiration strikes and sometimes when it doesn’t.

"""

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

# Footer
showFooter = false


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/emran-hossain-80ab17190/"


[[params.social]]
name = "github"
url = "https://github.com/git-emran/"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"

# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'algol'


